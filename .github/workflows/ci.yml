name: CI

on:
  # `main` alone. Every branch used to sit here, so a branch pushed before its pull
  # request existed still started a run. A push run and the pull request run of one
  # branch then shared a concurrency group. The pull request cancelled the push a
  # minute in, and GitHub recorded a check run for every job of the cancelled run,
  # with conclusion `cancelled`. A required check treats that entry as not-success:
  # #302 read `BLOCKED` with all thirteen jobs green. Deleting its cancelled push
  # run moved the pull request to `clean`. An `if:` on the job does not help,
  # because the entry is still published. A branch gets its checks from its pull
  # request. `workflow_dispatch` covers a branch tip nobody asked about. This run
  # on `main` is the one that says a merge landed green.
  push:
    branches: [main]
  pull_request:
  # A way to ask for a run against a commit that is already pushed. A workflow that
  # starts only from an event cannot check a branch tip after the fact.
  workflow_dispatch:

# One run per branch. `push` no longer fires for a branch (see above). On a pull
# request this group cancels the run of the previous commit when the branch moves
# again, which is the case it exists for. `head_ref` names the branch a pull request
# comes from, and it is empty on a push to `main`. The two events therefore never
# share a group by accident.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml, so the pin lives in exactly one place.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Test
        run: cargo nextest run --workspace --no-fail-fast

      # The docs feature is off by default. It still has to compile and pass.
      - name: Test (docs feature)
        run: cargo test -p acpilotd --features docs

      # The themes page promises this gate, so it gets a named step. A red build
      # names the check without opening the log. The task measures every foreground
      # token against both surfaces in every built-in theme. A pair below WCAG AA
      # fails with the token names and both ratios.
      - name: Theme contrast (WCAG AA)
        run: cargo test -p acpilot-extensions --test themes built_in_themes_meet_wcag_aa

  # The build writes `crates/acpilot-web/assets/index.html`, and nobody edits it by
  # hand. The repository commits it, so building the daemon needs no Node. That
  # trade works only if the committed page matches what `web/` produces. This job
  # checks that, so a source change without a rebuild fails here, in the pull
  # request. The alternative ships a daemon whose `/app` is older than its own
  # repository.
  #
  # The live shell test runs here too, which is why this job has a Rust toolchain.
  # That test spawns a real daemon. A fake one would prove the repaint against the
  # same mock the unit test already uses.
  #
  # The checks are one task, `cargo xtask web-check`. It runs install and
  # `svelte-check`, then the token-flow tests and the daemon build. Next come the
  # live shell test and the binaries, then Chromium runs that edit a file and
  # approve a permission. The page build and the drift comparison close the list.
  # They live in the task because a developer's `cargo xtask check` runs the same
  # list. Written here instead, the runner could keep checking five commands while
  # the local gate grew a sixth.
  web:
    name: web UI matches web/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2

      # `web-check` installs when `node_modules` is missing. The browser has to go
      # in after the package and before the run that uses it. `playwright` is a
      # devDependency, and its Chromium revision is the one that package expects,
      # not an `npx` download that may be newer.
      - name: Web dependencies
        working-directory: web
        run: npm ci

      # The browser alone, never `--with-deps`. That flag starts with
      # `apt-get update`, and on a runner that could not resolve
      # `security.ubuntu.com` it failed before a single test ran. Its log read like
      # missing fonts. The runner image already carries Chromium's runtime
      # libraries and its fonts, which is also why this job needs no apt at all.
      # The Playwright image is not an option here: it has no C toolchain, and this
      # job compiles the daemon and the CLI. Its Rust build stops at `linker cc not
      # found`. A library that is genuinely absent now fails in the e2e run, where
      # the browser names it.
      - name: Playwright browser
        working-directory: web
        run: npx playwright install chromium

      # Install, types, both test runs and the embedded page, in the task's order.
      # A drift failure names the page to commit and exits non-zero. The task leaves
      # the rebuilt file in the working tree, so the log has something to point at.
      - name: Web checks
        run: cargo xtask web-check

  # The desktop shell sits behind a feature that is off by default, so the `check`
  # job above never compiles it. One refactor could stop it building at all. This
  # job pays the price of that default: it builds, links and tests the shell with
  # the feature on.
  #
  # One Linux job rather than three. The code we write is platform-neutral, and
  # the platform-specific parts belong to gpui. Its own CI is not ours to
  # reproduce. The release matrix builds macOS and Windows, because that is where
  # their output goes. Checking them on every push would pay the same price twice.
  #
  # Linux needs two things the runner lacks. The first is the dev symlinks gpui's
  # Linux backend links against even with X11 off. The second is the `libc` version
  # that its `xattr` dependency still uses. ADR 0009 §5 documents both. This job
  # asserts the `libc` one, because `cargo update` breaks it silently and the error
  # a developer sees is `xattr`'s, not ours.
  gui:
    name: desktop shell (gui feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2

      - name: System libraries gpui links against
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev \
            libfreetype-dev libfontconfig1-dev pkg-config clang

      - name: The libc pin gpui 0.2.2 needs
        run: |
          set -euo pipefail
          versions=$(awk '/^name = "libc"$/ { getline; split($0, parts, "\""); print parts[2] }' Cargo.lock)
          test -n "$versions" || { echo "Cargo.lock lists no libc"; exit 1; }
          for version in $versions; do
            if [ "$version" != "0.2.189" ]; then
              echo "Cargo.lock has libc $version; gpui 0.2.2 -> xattr 0.2.3 uses libc::ENOATTR,"
              echo "which 0.2.190 removed. The pin is exact. Run:"
              echo "  cargo update -p libc --precise 0.2.189"
              exit 1
            fi
          done

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # The job's three checks are one task, so `cargo xtask gui-check` reproduces
      # them. The task runs the lint with both features: `gui-tests` decides what
      # the test targets compile, so the lint sees the same feature set the tests
      # do. It runs the link, because `check` does not link, and the Linux link is
      # exactly where the missing xkbcommon-x11 symlink appears. It runs the tests,
      # where `gui-tests` adds gpui's headless harness. That harness drives the
      # About panel and the palette that opens it in a real `Context` without a
      # display.
      #
      # A task and not raw cargo lines, for the reason every other job is a task.
      # The task states the feature pair and the order once, so this file cannot
      # fall behind what a local run does. `cargo xtask test all` is the workspace
      # gate plus this test run, which is what a full local session does. `cargo
      # xtask check` builds the shell but leaves the harness out, because the
      # harness is a second gpui build.
      - name: Check (gui feature, with the window harness)
        run: cargo xtask gui-check

  # P0-5 has two halves: a Windows program (`wsl.exe` driver) and a Linux one
  # (`acpilotd-helper`). The liftable part, `paths.rs`, compiles into
  # `acpilot-host` on every platform. Both jobs therefore run both halves on both
  # operating systems. A translation bug, or a helper that works only on the
  # machine someone wrote it on, is exactly what `docs/notes/wsl-helper.md` must
  # not get wrong. The WSL round trip itself needs a WSL2 distro, which no hosted
  # runner has, so it lives in the opt-in `wsl-bench` job below. The checks here
  # are the deterministic half of that note's "Testing both sides" table. This file
  # does not list them: `cargo xtask probe` runs them, so CI and a developer's
  # shell cannot drift apart.
  probes:
    name: p0-5 probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Deliberately not macOS: it is neither half of the Windows ↔ WSL pair.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          # `cargo xtask` is a workspace member, so the key covers the workspace
          # target and the probe's own target (a standalone crate with its own
          # lockfile).
          workspaces: |
            . -> target
            probes/wsl-helper -> target

      # Six checks live in xtask: fmt, clippy, the 23 tests, the helper's 4, and the
      # process-level protocol checker. One of them formats both the crate and the
      # helper that cargo never sees. The command here and the one a developer runs
      # are therefore the same command. That also keeps the Windows job off bash,
      # because xtask spawns cargo, rustfmt, rustc and python directly.
      - name: Probe checks
        run: cargo xtask probe

      # The guard stays here rather than in xtask. It asserts the binary's own exit
      # codes (1 and 2), a property of the program rather than of a command line.
      # The guard only means anything where wsl.exe is absent.
      - name: Platform guard
        if: runner.os == 'Linux'
        working-directory: probes/wsl-helper
        run: |
          set +e
          cargo run --quiet -- > /dev/null 2>&1
          bare=$?
          cargo run --quiet -- --help > /dev/null 2>&1
          help=$?
          set -e
          test "$bare" -eq 1 || { echo "bare run exited $bare, expected 1"; exit 1; }
          test "$help" -eq 2 || { echo "--help exited $help, expected 2"; exit 1; }

  # The end-to-end half of P0-5: start a real distro, spawn the Linux helper
  # through wsl.exe, and time it. Only this job reproduces the numbers in
  # `docs/notes/wsl-helper.md`. It needs the one thing `windows-latest` cannot
  # give: WSL2. WSL2 runs a real kernel in a Hyper-V VM, so it needs nested
  # virtualisation, which standard hosted runners lack
  # (actions/runner-images#5920). Such an image can offer WSL1 only, and WSL1
  # numbers describe a different product. The job is therefore opt-in, and it runs
  # only where WSL2 exists:
  #
  #   gh variable set WSL_BENCH  --body true
  #   gh variable set WSL_RUNNER --body '["self-hosted","windows","wsl2"]'
  #
  # Register a Windows machine with the `wsl2` label to turn it on. The distro's
  # own `wsl.exe -l -v` row is then the gate (`--require-wsl2`). A runner that
  # stopped being WSL2 fails here, instead of publishing WSL1 timings as if they
  # were the shipped path.
  wsl-bench:
    name: p0-5 bench (WSL2)
    if: vars.WSL_BENCH == 'true'
    runs-on: ${{ fromJSON(vars.WSL_RUNNER || '["self-hosted","windows","wsl2"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: probes/wsl-helper -> target

      # `install` compiles helper/acpilotd-helper.rs with the distro's own rustc
      # and writes ~/.local/bin/acpilotd-helper, the same path a developer uses.
      # The prerequisite is a rustc inside the distro.
      - name: Install the helper inside the distro
        run: cargo run --release --manifest-path probes/wsl-helper/Cargo.toml -- install

      # No `shell:` override on purpose. The only argument that needs quoting is
      # an expression, so this line is valid under bash and under pwsh.
      - name: Bench
        run: cargo run --release --manifest-path probes/wsl-helper/Cargo.toml -- bench --require-wsl2 --oracle --json "${{ runner.temp }}/wsl-helper.json"

      # The JSON is the artifact worth keeping. The note's table regenerates from
      # it, and `wsl_version` inside it says which product the run measured.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wsl-helper-bench
          path: ${{ runner.temp }}/wsl-helper.json
          if-no-files-found: warn

  # P6-12 promises "60 fps at 200×60, or it is a bug", and this job keeps that
  # promise out of the note. It draws the design pass's world into a `TestBackend`
  # at the size the budget states. That world is the tree, the editor with a real
  # parse, the session list, the transcript and both footer rows. It fails if the
  # mean or the 95th percentile misses one frame's worth of a 60 fps budget.
  #
  # Release, because an unoptimised build is nineteen times slower
  # (`docs/notes/tui-shell.md`) and that number describes nothing anybody runs.
  # The gate prints the worst frame but does not gate it. A shared runner produces
  # one occasionally, and one scheduler hiccup is not a regression. A sustained
  # doubling is, and the mean and the p95 see that doubling. The example exits 1 on
  # its own, so the failure reads as four numbers plus how far off the run was. It
  # does not read as a missing command.
  frame-budget:
    name: frame budget (200x60)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2

      - name: Draw 200x60 frames and hold them to 16.7 ms
        run: cargo run --release --quiet -p acpilot-tui --example frame -- 200 60 300 --budget 16.7

  # XT-4's gate. The budgets are the medians `cargo xtask resources` measured. The
  # job repeats the measurement three times and fails when one lands past its budget
  # plus a margin. Release, because a debug build is a different program, and no
  # `--debug` here for the same reason: `--gate` refuses it rather than comparing it
  # with release figures. The task is the gate. A hosted runner is noisier than the
  # machine the budgets came from, so this job catches a regression.
  # `docs/notes/resources.md` keeps the measured number and its hardware. Neither
  # makes a claim about a user's box.
  resources:
    name: resources (median of three)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2

      - name: Measure the daemon and the CLI against their budgets
        run: cargo xtask resources --gate

  deny:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  docs:
    name: openapi snapshot is committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      # Regenerating must be a no-op. A wire change has to arrive as a reviewed
      # diff, not as something a client discovers.
      - name: Regenerate OpenAPI snapshot
        run: INSTA_UPDATE=always cargo test -p acpilot-proto
      - name: Fail if the snapshot changed
        run: git diff --exit-code -- crates/acpilot-proto/tests/snapshots

  # The prose gate. It reads the documentation a pull request touches and reports
  # what AGENTS.md rejects. Source comments stay out of CI on purpose. A file
  # written before the rule still carries its old prose, and the local hook keeps
  # that debt from growing.
  ste:
    name: STE prose lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The script diffs against the base, so the clone needs the full history.
          fetch-depth: 0

      # `github.base_ref` is the pull request's target. On a push to `main` it is
      # empty, and the run compares `main` with itself.
      - name: Lint the documentation the change touches
        run: scripts/ste-check.sh --docs "origin/${{ github.base_ref || 'main' }}"

  # CONTRIBUTING's "Git history" rules, checked. Each rule describes a state this
  # repository reached. One merge kept one side's tree, so `main`'s work counted as
  # merged and then vanished. Another pull request could not merge at all. Both are
  # cheap to see here and expensive to find at the merge button.
  #
  # A full history, because the check compares every merge with both of its parents.
  # A shallow clone has neither the merge commits nor the base to compare them with.
  history:
    name: branch history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The branch's own tip, not the merge commit GitHub builds from base and
          # head. That commit's tree equals the head's whenever the branch already
          # contains the base. The job would then find an "ours" merge of its own
          # making and report the harness instead of the branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2

      # `github.base_ref` is the pull request's target. It is empty on a push,
      # where the branch has not said where it is going, so `main` is the only
      # answer.
      - name: History rules
        run: cargo xtask history-check --base "origin/${{ github.base_ref || 'main' }}"

  # docs/git-howto.md §3.2, §5.2 and §7.2, checked from one pull request. A phase
  # PR targets `main`. It starts `Phase <N>: ` and `Stack: phase root`, and it
  # keeps an open item PR while unblocked work remains. An item PR targets the
  # branch below it, never `main`. Its title is `[<N>.<seq>] <title> (#<issue>)`.
  # Its body starts `Stack: <seq> of <total> · base: <branch> · phase: #<pr>`, and
  # it closes its issue. A phase PR names its roadmap issue as `Phase issue: #<n>`.
  # An item's issue must be a sub-issue of that issue. A phase number can carry a
  # decimal part (`4.5`), because the roadmap ships Models and Mod shop that way.
  # The rule is read from branch names, so no list goes stale.
  #
  # A push to `main` and a manual run have no pull request, and they pass. The job
  # is in both aggregations for that reason: a skipped entry is not a success.
  phase:
    name: phase and item links
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number || '' }}
      HEAD_REF: ${{ github.head_ref || '' }}
      BASE_REF: ${{ github.base_ref || '' }}
    steps:
      - name: The phase and item shape from docs/git-howto.md
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then
            echo "no pull request; nothing to check"
            exit 0
          fi
          fail() { echo "$1"; exit 1; }

          # `phase/4.5-models` names phase `4.5`. `item/4.5.1-60-skills` names
          # phase `4.5`, stack position `1` and issue `60`. The phase part takes
          # one decimal: the roadmap ships `4.5 · Models` as a phase of its own.
          phase=$(printf '%s' "$HEAD_REF" | sed -nE 's|^phase/([0-9]+(\.[0-9]+)?)-[a-z0-9-]+$|\1|p')
          item=$(printf '%s' "$HEAD_REF" | sed -nE 's|^item/([0-9]+(\.[0-9]+)?)\.([0-9]+)-([0-9]+)-[a-z0-9-]+$|\1 \3 \4|p')
          case "$HEAD_REF" in
            phase/*|item/*) ;;
            *) echo "$HEAD_REF is not a phase or item branch; the guide does not cover it"; exit 0 ;;
          esac
          [ -n "$phase" ] || [ -n "$item" ] \
            || fail "a phase number is <n> or <n>.<m>, and an item is item/<phase>.<seq>-<issue>-<slug>"

          title=$(gh pr view "$PR" --json title --jq .title)
          body=$(gh pr view "$PR" --json body --jq .body)
          first=$(printf '%s\n' "$body" | head -n 1)

          if [ -n "$phase" ]; then
            [ "$BASE_REF" = main ] || fail "phase branch $HEAD_REF targets $BASE_REF; a phase PR targets main"
            case "$title" in
              "Phase $phase: "*) ;;
              *) fail "the title does not start with 'Phase $phase: '" ;;
            esac
            [ "$first" = "Stack: phase root" ] || fail "the body does not start with 'Stack: phase root'"
            printf '%s' "$body" | grep -Eqi "(close[sd]?|fix(es|ed)?|resolve[sd]?)[[:space:]]+#[0-9]+" \
              || fail "the body closes no issue; add 'Closes #<issue>' for each item and the phase"
            # The item check walks this link, so the phase PR names the roadmap
            # issue it belongs to. Without it an item has nothing to be a
            # sub-issue of, and the check would have to guess from a title.
            phase_issue=$(printf '%s\n' "$body" \
              | sed -nE 's/^Phase issue: #([0-9]+)([^0-9]|$).*/\1/p' | head -n 1)
            [ -n "$phase_issue" ] \
              || fail "the body names no phase issue; add 'Phase issue: #<n>' for the roadmap issue"
            # §7.2 calls a phase without an item PR unhealthy only while
            # unblocked work remains. When the last item merges, the phase PR is
            # the remaining work and lands at once (§5.5). A hard failure here
            # would then block the very merge it is waiting on.
            open_items=$(gh pr list --base "$HEAD_REF" --state open --json number --jq 'length')
            if [ "$open_items" = 0 ]; then
              echo "note: no open item PR on $HEAD_REF; expected only while the phase lands"
            fi
          fi

          if [ -n "$item" ]; then
            read -r phase_of_item stack issue <<< "$item"
            seq="$phase_of_item.$stack"
            [ "$BASE_REF" != main ] || fail "item branch $HEAD_REF targets main; it must target the branch below it"
            case "$BASE_REF" in
              phase/*|item/*) ;;
              *) fail "item branch $HEAD_REF targets $BASE_REF; its base must be the phase or the item below it" ;;
            esac
            [ "$(gh pr list --head "$BASE_REF" --state open --json number --jq 'length')" != 0 ] \
              || fail "no open PR for $BASE_REF, so $HEAD_REF has no branch below it in the stack"
            case "$title" in
              "[$seq] "*) ;;
              *) fail "the title does not start with '[$seq] '" ;;
            esac
            case "$title" in
              *"(#$issue)") ;;
              *) fail "the title does not end with '(#$issue)'" ;;
            esac
            case "$first" in
              "Stack: "*" · base: $BASE_REF · phase: #"*) ;;
              *) fail "the body does not start with 'Stack: <seq> of <total> · base: $BASE_REF · phase: #<pr>'" ;;
            esac
            phase_pr=$(printf '%s\n' "$first" | sed -nE 's/.* · phase: #([0-9]+)$/\1/p')
            [ -n "$phase_pr" ] || fail "the body names no phase PR; add 'phase: #<pr>' to the first line"
            phase_title=$(gh pr view "$phase_pr" --json title --jq .title 2>/dev/null || true)
            phase_base=$(gh pr view "$phase_pr" --json baseRefName --jq .baseRefName 2>/dev/null || true)
            case "$phase_title" in
              "Phase $phase_of_item: "*)
                ;;
              *) fail "phase PR #$phase_pr is '$phase_title', not 'Phase ${seq%%.*}: <name>'" ;;
            esac
            [ "$phase_base" = main ] || fail "phase PR #$phase_pr targets '$phase_base'; the phase PR is the trunk and targets main"
            # The phase issue is an ancestor of the item's issue. That link is the
            # roadmap, so an item under another phase fails even when every PR
            # field is right. The cap stops a cycle.
            phase_body=$(gh pr view "$phase_pr" --json body --jq .body 2>/dev/null || true)
            phase_issue=$(printf '%s\n' "$phase_body" \
              | sed -nE 's/^Phase issue: #([0-9]+)([^0-9]|$).*/\1/p' | head -n 1)
            [ -n "$phase_issue" ] \
              || fail "phase PR #$phase_pr names no phase issue; add 'Phase issue: #<n>' to it"
            parent_of() { gh api "repos/$GH_REPO/issues/$1/parent" --jq .number 2>/dev/null; }
            ancestor=$issue
            linked=""
            for _ in 1 2 3 4 5 6 7 8; do
              ancestor=$(parent_of "$ancestor") || break
              if [ "$ancestor" = "$phase_issue" ]; then
                linked=1
                break
              fi
            done
            [ -n "$linked" ] \
              || fail "#$issue is not a sub-issue of #$phase_issue, the phase issue on PR #$phase_pr. Add it to that phase."
            printf '%s' "$body" | grep -Eqi "(^|[^A-Za-z])(close[sd]?|fix(es|ed)?|resolve[sd]?)[[:space:]]+#$issue([^0-9]|$)" \
              || fail "the body does not close #$issue"
          fi

          echo "$HEAD_REF has the shape docs/git-howto.md asks for"
  # One check to require in branch protection. The rule then does not need a
  # restatement every time a job arrives, and it cannot silently stop covering a
  # job that someone renames. This job needs every gate above and passes only if
  # all of them passed, which is the predicate a required check should express.
  #
  # The opt-in `wsl-bench` job is deliberately absent from `needs`. A hosted runner
  # skips it, and a skipped job in `needs` would either block every pull request or
  # need the same exception twice.
  #
  # Protect `main` with:
  #
  #   required status checks: "required checks"
  #   require branches to be up to date before merging: yes
  #
  # The PR's checks tab lists the individual jobs either way. This is the one a
  # rule points at. The ruleset on `main` requires the single context
  # `required checks` and allows no bypass.
  #
  # GitHub records a check run for every job of a run, a cancelled one included. A
  # `cancelled` entry under a required name counts as not-success in that commit's
  # rollup. #302 read `BLOCKED` with every job green, and deleting its cancelled
  # push run moved the pull request to `clean` with no other change.
  #
  # A branch push and the pull request of the same commit share one concurrency
  # group. The later event cancels the earlier one, so the two events cannot
  # publish one name. A job's `name` is a literal: an expression there becomes the
  # name, which is how the first attempt published a check called
  # `github.event_name == ...`. The two events therefore get two jobs over one
  # assertion.
  required:
    name: required checks
    needs: [check, web, gui, probes, frame-budget, resources, deny, docs, history, ste, phase]
    # `always()` also fired inside a cancelled run, where every dependency reports
    # `cancelled`. `!cancelled()` runs the job after a dependency fails, which is
    # the case it exists for. It stays out of a cancelled run, where it has nothing
    # to say. Only the event that merges publishes the name the ruleset asks for.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: >-
            check=${{ needs.check.result }}
            web=${{ needs.web.result }}
            gui=${{ needs.gui.result }}
            probes=${{ needs.probes.result }}
            frame-budget=${{ needs.frame-budget.result }}
            resources=${{ needs.resources.result }}
            deny=${{ needs.deny.result }}
            docs=${{ needs.docs.result }}
            history=${{ needs.history.result }}
            ste=${{ needs.ste.result }}
            phase=${{ needs.phase.result }}
        run: |
          set -euo pipefail
          failed=""
          for pair in $RESULTS; do
            name=${pair%%=*}
            result=${pair#*=}
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              failed="$failed $name($result)"
            fi
          done
          if [ -n "$failed" ]; then
            echo "required job(s) did not pass:$failed"
            exit 1
          fi

  # The same assertion under a name of its own, for the runs that are not a pull
  # request: a push to `main` and a manual run. The required name belongs to the
  # pull request alone. A job in a run publishes its name there whatever its `if:`
  # says, so this job cannot be the one called `required checks`. Keep the two step
  # bodies in step. They are the same check because they serve the same gate.
  required-branch:
    name: required checks (branch)
    needs: [check, web, gui, probes, frame-budget, resources, deny, docs, history, ste, phase]
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: >-
            check=${{ needs.check.result }}
            web=${{ needs.web.result }}
            gui=${{ needs.gui.result }}
            probes=${{ needs.probes.result }}
            frame-budget=${{ needs.frame-budget.result }}
            resources=${{ needs.resources.result }}
            deny=${{ needs.deny.result }}
            docs=${{ needs.docs.result }}
            history=${{ needs.history.result }}
            ste=${{ needs.ste.result }}
            phase=${{ needs.phase.result }}
        run: |
          set -euo pipefail
          failed=""
          for pair in $RESULTS; do
            name=${pair%%=*}
            result=${pair#*=}
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              failed="$failed $name($result)"
            fi
          done
          if [ -n "$failed" ]; then
            echo "job(s) did not pass:$failed"
            exit 1
          fi
