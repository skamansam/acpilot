name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml, so the pin is defined in exactly one place.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Test
        run: cargo nextest run --workspace --no-fail-fast

      # The docs feature is off by default; it still has to compile and pass.
      - name: Test (docs feature)
        run: cargo test -p acpilotd --features docs

      # The themes page promises this gate, so it gets a named step: a red build
      # says which check failed without opening the log. Every foreground token
      # is measured against both surfaces in every built-in theme; a pair below
      # WCAG AA fails with the token names and both ratios.
      - name: Theme contrast (WCAG AA)
        run: cargo test -p acpilot-extensions --test themes built_in_themes_meet_wcag_aa

  # `crates/acpilot-web/assets/index.html` is built, not hand-written, and it is
  # committed so that building the daemon needs no Node. That trade only works if
  # the committed page is the one `web/` produces, which is what this job checks:
  # a source change without a rebuild fails here, in the pull request, rather than
  # shipping a daemon whose `/app` is older than its own repository.
  web:
    name: web UI matches web/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Type-check
        working-directory: web
        run: npm run check

      # The token flow is a browser fact, so it is tested in a DOM rather than
      # checked by hand: the token is kept in the tab, sent only in an
      # `Authorization` header, and forgotten when the daemon refuses it.
      - name: Token-flow tests
        working-directory: web
        run: npm test

      - name: Build into the crate that embeds it
        working-directory: web
        run: npm run build

      - name: Fail if the embedded page drifted from its source
        run: git diff --exit-code -- crates/acpilot-web/assets/index.html

  # The desktop shell is behind a feature that is off by default, so the `check`
  # job above never compiles it — which means it is one refactor away from not
  # building at all. This job is the price of that default: it builds, links and
  # tests the shell with the feature on.
  #
  # One Linux job rather than three: the code we write is platform-neutral, and
  # the platform-specific parts belong to gpui, whose own CI is not ours to
  # reproduce. The release matrix is where macOS and Windows are built, because
  # that is where their output is needed — checking them on every push would pay
  # the same price twice.
  #
  # The two things Linux needs that the runner does not have are the dev symlinks
  # gpui's Linux backend links against even with X11 off, and the `libc` version
  # its `xattr` dependency still uses. Both are documented in ADR 0009 §5; the
  # `libc` one is asserted here because `cargo update` breaks it silently and the
  # error a developer sees is `xattr`'s, not ours.
  gui:
    name: desktop shell (gui feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2

      - name: System libraries gpui links against
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev \
            libfreetype-dev libfontconfig1-dev pkg-config clang

      - name: The libc pin gpui 0.2.2 needs
        run: |
          set -euo pipefail
          versions=$(awk '/^name = "libc"$/ { getline; split($0, parts, "\""); print parts[2] }' Cargo.lock)
          test -n "$versions" || { echo "Cargo.lock lists no libc"; exit 1; }
          for version in $versions; do
            if [ "$version" != "0.2.189" ]; then
              echo "Cargo.lock has libc $version; gpui 0.2.2 -> xattr 0.2.3 uses libc::ENOATTR,"
              echo "which 0.2.190 removed. The pin is exact. Run:"
              echo "  cargo update -p libc --precise 0.2.189"
              exit 1
            fi
          done

      - name: Clippy (gui feature)
        run: cargo clippy -p acpilot-gui --features gui,gui-tests --all-targets -- -D warnings

      # `check` and a test build do not link the binary, and the Linux link is
      # exactly where the missing xkbcommon-x11 symlink shows up.
      - name: Build the binary
        run: cargo build -p acpilot-gui --features gui

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # `gui-tests` adds gpui's headless harness, so the About panel and the
      # palette that opens it are tested in a real `Context` without a display.
      # It is not in the default feature set because it compiles gpui's
      # `test-support` machinery, which the plain workspace gate should not pay
      # for.
      - name: Test (gui feature, with the window harness)
        run: cargo nextest run -p acpilot-gui --features gui,gui-tests --no-fail-fast

  # P0-5's two halves are a Windows program (`wsl.exe` driver) and a Linux one
  # (`acpilotd-helper`), and the liftable part — `paths.rs` — is compiled into
  # `acpilot-host` on every platform. So both halves are tested on both operating
  # systems: a translation bug or a helper that only works on the machine it was
  # written on is exactly what `docs/notes/wsl-helper.md` must not be wrong about.
  # The WSL round trip itself needs a WSL2 distro, which no hosted runner has;
  # it lives in the opt-in `wsl-bench` job below. The checks here are the
  # deterministic half of that note's "Testing both sides" table, and they are
  # not written out here: `cargo xtask probe` runs them, so CI and a developer's
  # shell cannot drift apart.
  probes:
    name: p0-5 probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Deliberately not macOS: it is neither half of the Windows ↔ WSL pair.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          # `cargo xtask` is a workspace member, so the workspace target joins the
          # probe's own (a standalone crate with its own lockfile) in the key.
          workspaces: |
            . -> target
            probes/wsl-helper -> target

      # The six checks — fmt for the crate and for the helper that cargo never
      # sees, clippy, the 23 tests, the helper's 4, and the process-level
      # protocol checker — live in xtask so that the command here and the one a
      # developer runs are the same command. That also keeps the Windows job off
      # bash: xtask spawns cargo, rustfmt, rustc and python directly.
      - name: Probe checks
        run: cargo xtask probe

      # The guard stays here rather than in xtask: it asserts the binary's own
      # exit codes (1 and 2), a property of the program rather than of a command
      # line, and it only means anything where wsl.exe is absent.
      - name: Platform guard
        if: runner.os == 'Linux'
        working-directory: probes/wsl-helper
        run: |
          set +e
          cargo run --quiet -- > /dev/null 2>&1
          bare=$?
          cargo run --quiet -- --help > /dev/null 2>&1
          help=$?
          set -e
          test "$bare" -eq 1 || { echo "bare run exited $bare, expected 1"; exit 1; }
          test "$help" -eq 2 || { echo "--help exited $help, expected 2"; exit 1; }

  # The end-to-end half of P0-5: start a real distro, spawn the Linux helper
  # through wsl.exe, and time it. This is the only job that reproduces the
  # numbers in `docs/notes/wsl-helper.md`, and it needs the one thing
  # `windows-latest` cannot give — WSL2. WSL2 runs a real kernel in a Hyper-V VM,
  # so it needs nested virtualisation, which standard hosted runners do not have
  # (actions/runner-images#5920); the image can offer WSL1 only, and WSL1 numbers
  # describe a different product. So the job is opt-in, and only runs where WSL2
  # exists:
  #
  #   gh variable set WSL_BENCH  --body true
  #   gh variable set WSL_RUNNER --body '["self-hosted","windows","wsl2"]'
  #
  # Register a Windows machine with the `wsl2` label to turn it on. The distro's
  # own `wsl.exe -l -v` row is then the gate (`--require-wsl2`), so a runner that
  # stopped being WSL2 fails here instead of publishing WSL1 timings as if they
  # were the shipped path.
  wsl-bench:
    name: p0-5 bench (WSL2)
    if: vars.WSL_BENCH == 'true'
    runs-on: ${{ fromJSON(vars.WSL_RUNNER || '["self-hosted","windows","wsl2"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: probes/wsl-helper -> target

      # `install` compiles helper/acpilotd-helper.rs with the distro's own rustc
      # and writes ~/.local/bin/acpilotd-helper — the same path a developer uses,
      # so the prerequisite is a rustc inside the distro.
      - name: Install the helper inside the distro
        run: cargo run --release --manifest-path probes/wsl-helper/Cargo.toml -- install

      # No `shell:` override on purpose: the only argument that needs quoting is
      # an expression, so this line is valid under bash and under pwsh.
      - name: Bench
        run: cargo run --release --manifest-path probes/wsl-helper/Cargo.toml -- bench --require-wsl2 --oracle --json "${{ runner.temp }}/wsl-helper.json"

      # The JSON is the artifact worth keeping: it is what the note's table is
      # regenerated from, and `wsl_version` in it says which product it measured.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wsl-helper-bench
          path: ${{ runner.temp }}/wsl-helper.json
          if-no-files-found: warn

  deny:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  docs:
    name: openapi snapshot is committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      # Regenerating must be a no-op: a wire change has to be reviewed as a diff,
      # not discovered by a client.
      - name: Regenerate OpenAPI snapshot
        run: INSTA_UPDATE=always cargo test -p acpilot-proto
      - name: Fail if the snapshot changed
        run: git diff --exit-code -- crates/acpilot-proto/tests/snapshots

  # One check to require in branch protection, so the rule does not have to be
  # restated every time a job is added — and cannot silently stop covering one
  # when a job is renamed. It needs every gate above and passes only if all of
  # them passed, which is exactly the predicate a required check should express.
  #
  # The opt-in jobs (`wsl-bench`) are deliberately not in `needs`: they are
  # skipped on a hosted runner, and a skipped job in `needs` would either block
  # every pull request or need the same exception twice.
  #
  # Protect `main` with:
  #
  #   required status checks: "required checks"
  #   require branches to be up to date before merging: yes
  #
  # The individual jobs stay listed in the PR's checks tab either way; this is the
  # one a rule points at.
  required:
    name: required checks
    needs: [check, web, gui, probes, deny, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: >-
            check=${{ needs.check.result }}
            web=${{ needs.web.result }}
            gui=${{ needs.gui.result }}
            probes=${{ needs.probes.result }}
            deny=${{ needs.deny.result }}
            docs=${{ needs.docs.result }}
        run: |
          set -euo pipefail
          failed=""
          for pair in $RESULTS; do
            name=${pair%%=*}
            result=${pair#*=}
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              failed="$failed $name($result)"
            fi
          done
          if [ -n "$failed" ]; then
            echo "required job(s) did not pass:$failed"
            exit 1
          fi
