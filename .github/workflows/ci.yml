name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Reads rust-toolchain.toml, so the pin is defined in exactly one place.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Test
        run: cargo nextest run --workspace --no-fail-fast

      # The docs feature is off by default; it still has to compile and pass.
      - name: Test (docs feature)
        run: cargo test -p acpilotd --features docs

  deny:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  docs:
    name: openapi snapshot is committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      # Regenerating must be a no-op: a wire change has to be reviewed as a diff,
      # not discovered by a client.
      - name: Regenerate OpenAPI snapshot
        run: INSTA_UPDATE=always cargo test -p acpilot-proto
      - name: Fail if the snapshot changed
        run: git diff --exit-code -- crates/acpilot-proto/tests/snapshots
