name: Docs

# The site is always built and link-checked. Deployment to GitHub Pages is gated
# on the repository variable DOCS_DEPLOY=true, because Pages is not available for
# private repositories on every plan — and a workflow that fails on every push for
# an account setting is a workflow people learn to ignore.
#
# To publish: make the repository public (or use a plan with Pages), then
#   gh variable set DOCS_DEPLOY --body true
# Until then, `cd site && npm run dev` is the preview.

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        env:
          # The download page reads the releases API at build time. Anonymous
          # requests are rate-limited per IP, and a runner's IP is everybody's.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      # A broken internal link is a documentation bug, so fail the build on one
      # instead of shipping it and hoping nobody clicks.
      - name: Check internal links
        working-directory: site
        run: node scripts/check-links.mjs

      - uses: actions/upload-pages-artifact@v3
        if: vars.DOCS_DEPLOY == 'true'
        with:
          path: site/dist

  deploy:
    needs: build
    if: vars.DOCS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
