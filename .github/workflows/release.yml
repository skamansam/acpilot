name: release

# A release is a version, and a version is what the merged PR's labels say it is
# (`.github/scripts/next_version.py`):
#
#   breaking / major          → major
#   feature / enhancement     → minor
#   bug / docs / chore / …    → patch
#   skip-release              → nothing
#
# This workflow runs on `push` to main, not on `pull_request: closed`. A token on
# a pull request from a fork cannot publish. The `version` job reads the labels
# from the merge commit instead (`commits/<sha>/pulls`). That works for merge
# commits and squash merges alike, and it needs no second trigger. Once main only
# takes pull requests, the two events describe the same change.
#
# The artifacts are cargo-dist's (ADR 0011). `cargo xtask dist` is the only thing
# that packages anything: `--artifacts local` on the runner for each target, and
# `--artifacts global` once for the installers, the formula and the SBOMs. Editing
# an archive after dist made it would invalidate the checksum baked into the
# installer built from it, so nothing here touches one.
#
# The `homebrew` job installs the formulae with Homebrew on a macOS runner before
# anything goes out. That is the only way to learn two things. The keg a
# `brew install` makes answers `acpilot update --check` with `brew`, which is the
# marker ADR 0010 reads. And the client's keg and the daemon's can share one
# prefix. `publish` waits for this job, so a formula nobody can install stops the
# release instead of shipping.
#
# The `tap` job publishes the same formulae to `skamansam/homebrew-tap` after
# Homebrew installs one. `publish` waits for that job too, because the tap is what
# a `brew install` reads. It must not name a version whose archives nobody shipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      publish: ${{ steps.next.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the labels of the PR this commit came from
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].labels[].name' 2>/dev/null | paste -sd, - || true)
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          echo "labels: ${labels:-<none>}"

      - name: Next version
        id: next
        env:
          LABELS: ${{ steps.labels.outputs.labels }}
        run: |
          set -euo pipefail
          out=$(python3 .github/scripts/next_version.py --labels "$LABELS")
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"
          version=$(sed -n 's/^version=//p' <<<"$out")
          tag=$(sed -n 's/^tag=//p' <<<"$out")
          if [ -z "$version" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "the labels asked for no release"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already published"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  archives:
    name: archives ${{ matrix.triple }}
    needs: version
    if: needs.version.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          # `macos-latest`, not `macos-14`. The pinned label asks this account for the
          # `macos-14-arm64-us-default` configuration, which it does not have, so the job
          # stops before a runner starts
          # (`The configuration 'macos-14-arm64-us-default' is not supported`). The
          # floating label resolves to `macos-26-arm64`, which is the architecture named
          # in `triple`. It is also the label CI runs on.
          - os: macos-latest
            triple: aarch64-apple-darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The graphics stack gpui links against. Linux only. The Windows and macOS
      # runners have their system frameworks already. This job installs
      # `libxkbcommon-x11-dev` because gpui 0.2.2's `xkbcommon` dependency enables
      # the X11 feature unconditionally. The linker therefore asks for
      # `-lxkbcommon-x11`, even though the shell can run Wayland-only. See ADR 0009 §5.
      - name: System libraries gpui links against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev \
            libfreetype-dev libfontconfig1-dev pkg-config clang

      - name: The libc pin gpui 0.2.2 needs
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          versions=$(awk '/^name = "libc"$/ { getline; split($0, parts, "\""); print parts[2] }' Cargo.lock)
          test -n "$versions" || { echo "Cargo.lock lists no libc"; exit 1; }
          for version in $versions; do
            if [ "$version" != "0.2.189" ]; then
              echo "Cargo.lock has libc $version; gpui 0.2.2 -> xattr 0.2.3 uses libc::ENOATTR,"
              echo "which 0.2.190 removed. The pin is exact. Run:"
              echo "  cargo update -p libc --precise 0.2.189"
              exit 1
            fi
          done

      # The daemon carries `acpilotd-helper` so a remote host that has never seen
      # acpilot receives it on first connect (P3-9). Musl, because the host's libc
      # is not ours to assume: the static binary runs on a distro the daemon knows
      # nothing about. `build.rs` embeds whatever `ACPILOT_HELPER_BIN` names, and a
      # build without it behaves as before — asking the host's `PATH`.
      #
      # The path is absolute because a build script runs in its own crate's directory,
      # not the workspace root. The relative form resolved to
      # `crates/acpilotd/target/…`, which no build writes. Every Linux release
      # therefore failed in `build.rs` with "could not be read".
      - name: Build the helper the daemon carries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked -p acpilotd-helper --target x86_64-unknown-linux-musl
          echo "ACPILOT_HELPER_BIN=$GITHUB_WORKSPACE/target/x86_64-unknown-linux-musl/release/acpilotd-helper" >> "$GITHUB_ENV"

      # The version is pinned in `dist-workspace.toml` and read back here, so a
      # release and a local `cargo xtask dist` are the same tool's output. The task
      # refuses a dist other than the pinned one, and prints this command when it is
      # missing.
      # `cargo xtask dist` refuses to start without cargo-cyclonedx, because
      # `dist-workspace.toml` asks for an SBOM per program (P12-6 reads them). This
      # job installs the tool as well as `installers` does. Each target's runner runs
      # the task, and the earlier version of this job installed only cargo-dist. Every
      # archive job then failed before it built anything, while `installers` passed.
      - name: The pinned cargo-dist and the SBOM tool
        shell: bash
        run: |
          set -euo pipefail
          pinned=$(sed -n 's/^cargo-dist-version = "\(.*\)"/\1/p' dist-workspace.toml)
          test -n "$pinned" || { echo "dist-workspace.toml pins no cargo-dist version"; exit 1; }
          command -v dist >/dev/null || cargo install cargo-dist --version "$pinned" --locked
          command -v cargo-cyclonedx >/dev/null || cargo install cargo-cyclonedx --locked
          dist --version

      # A binary built without the key cannot verify a release signature, so it
      # refuses to update itself. That is the right failure, and it is the wrong
      # release. Fail here, where the message says which variable is missing.
      - name: The key this build would verify with
        shell: bash
        env:
          ACPILOT_RELEASE_PUBKEY: ${{ vars.ACPILOT_RELEASE_PUBKEY }}
        run: |
          set -euo pipefail
          if [ -z "${ACPILOT_RELEASE_PUBKEY:-}" ]; then
            echo "ACPILOT_RELEASE_PUBKEY is not set, so this build could not verify a" >&2
            echo "release signature. Set the repository variable; docs/release-key.md" >&2
            echo "has the key generation and the rotation window." >&2
            exit 1
          fi
          echo "${#ACPILOT_RELEASE_PUBKEY} characters of public key"

      - name: Build this target's archives
        shell: bash
        env:
          # Compiled in by `acpilot_core::VERSION`, so the binaries report the tag they
          # are published as rather than the number in `Cargo.toml`.
          ACPILOT_RELEASE_VERSION: ${{ needs.version.outputs.version }}
          # The key `acpilot update` verifies a release signature against. Without it
          # the binary refuses to replace itself, which is why the repository variable
          # is required rather than optional.
          ACPILOT_RELEASE_PUBKEY: ${{ vars.ACPILOT_RELEASE_PUBKEY }}
        run: cargo xtask dist --artifacts local --target "${{ matrix.triple }}"


      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.triple }}
          path: |
            target/distrib/*.tar.gz
            target/distrib/*.tar.gz.sha256
            target/distrib/*.zip
            target/distrib/*.zip.sha256
          if-no-files-found: error

  installers:
    name: installers
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The pinned cargo-dist and the SBOM tool
        shell: bash
        run: |
          set -euo pipefail
          pinned=$(sed -n 's/^cargo-dist-version = "\(.*\)"/\1/p' dist-workspace.toml)
          test -n "$pinned" || { echo "dist-workspace.toml pins no cargo-dist version"; exit 1; }
          command -v dist >/dev/null || cargo install cargo-dist --version "$pinned" --locked
          command -v cargo-cyclonedx >/dev/null || cargo install cargo-cyclonedx --locked

      # This job makes the global artifacts once for the release, not once per
      # target. They are the shell and PowerShell installers, the Homebrew formula
      # (with the marker ADR 0010 reads), the SBOM per program, and the combined
      # checksum file.
      # The merged pull request's labels set the version this release publishes as,
      # not `Cargo.toml`, and dist refuses a `--tag` that disagrees with the
      # manifest. The task therefore writes the release version into the installers
      # and the formula after dist generates them. They then name the tag `publish`
      # is about to create.
      - name: Build the installers, formula and SBOMs
        shell: bash
        run: cargo xtask dist --artifacts global --release-version "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: global
          path: |
            target/distrib/*.sh
            target/distrib/*.ps1
            target/distrib/*.rb
            target/distrib/*.cdx.xml
            target/distrib/source.tar.gz
            target/distrib/source.tar.gz.sha256
            target/distrib/sha256.sum
          if-no-files-found: error

  homebrew:
    name: homebrew (macos)
    # `archives` is a need, not just `installers`. This job downloads every artifact
    # of the run, so it must wait until the archives jobs upload theirs. A download
    # that starts earlier finds only the installers' `global` artifact. The failure
    # then reads as a missing `acpilot-cli-aarch64-apple-darwin.tar.gz`.
    needs: [version, archives, installers]
    if: needs.version.outputs.publish == 'true'
    # A formula is a claim about this release. The release holds the archive it
    # names. The client's install block puts a marker beside the binary. That
    # marker makes the keg report itself as `brew` rather than as the user's own
    # copy. Only Homebrew on a mac can answer that, so this job runs there. It runs
    # before `publish`, because a release whose formula does not install is a
    # release nobody can reach through the tap.
    #
    # This job installs the client's and the daemon's formulae together, because
    # they share one prefix. The marker is a path in `bin`, and two kegs writing it
    # would be a link conflict rather than two answers. That is the pair the tap's
    # instructions name, so that is the pair this job tests.
    #
    # `macos-latest` is the arm64 runner for the reason the archives matrix gives.
    runs-on: macos-latest
    steps:
      # Every artifact of the run, merged: the generated formula and the archive
      # for this runner's architecture. The formula names that archive. This job
      # waits for the archives job, so the archive exists by now.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Each formula names the tag this release will publish under, and that tag
      # does not exist while this job runs. `publish` creates the tag after this job
      # tests the formulae. This runner therefore serves the same downloads itself:
      # same file names, same version segment, same install block. The one thing it
      # cannot test is whether a URL under the real release answers, because no
      # runner can know that before `publish` runs.
      - name: Install the formulae Homebrew was given
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH}" in
            ARM64) triple=aarch64-apple-darwin ;;
            X64) triple=x86_64-apple-darwin ;;
            *) echo "no mac archive for RUNNER_ARCH=${RUNNER_ARCH}"; exit 1 ;;
          esac
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' dist/acpilot-cli.rb)
          test -n "$version" || { echo "the formula declares no version"; exit 1; }
          mirror="$PWD/mirror/releases/download/v$version"
          mkdir -p "$mirror"
          for program in acpilot-cli acpilotd; do
            cp "dist/$program-$triple.tar.gz" "dist/$program-$triple.tar.gz.sha256" "$mirror/"
          done
          python3 -m http.server 8788 --directory mirror &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 1
          for formula in dist/acpilot-cli.rb dist/acpilotd.rb; do
            python3 -c 'import pathlib, sys; path = pathlib.Path(sys.argv[1]); path.write_text(path.read_text().replace("https://github.com/skamansam/acpilot", "http://127.0.0.1:8788"))' "$formula"
            grep -c 'http://127.0.0.1:8788' "$formula"
          done
          # Homebrew 4.6 and later refuse a formula outside a tap. A tap is a
          # directory, and it needs no Git repository. This step copies the
          # generated formulae into one and installs them by tap-qualified name.
          # Homebrew trusts a fully qualified install without a separate trust step.
          tap="$(brew --repository)/Library/Taps/acpilot/homebrew-local"
          mkdir -p "$tap/Formula"
          cp dist/acpilot-cli.rb dist/acpilotd.rb "$tap/Formula/"
          brew install --formula acpilot/local/acpilot-cli acpilot/local/acpilotd

      # The marker is the whole point: without it `acpilot update` treats a keg as
      # the user's own and writes over a file `brew upgrade` will discard. `--check`
      # is the report that says which, and a plain `update` must refuse. Both kegs
      # are present here, so this is the marker with the daemon's formula installed
      # beside the client's, not the client's alone.
      - name: acpilot says the installation is Homebrew's
        run: |
          set -euo pipefail
          brew list --formula | grep -qx acpilot-cli
          brew list --formula | grep -qx acpilotd
          marker="$(brew --prefix)/bin/install.json"
          test -s "$marker" || { echo "no marker was linked beside the binary"; exit 1; }
          cat "$marker"
          grep -q '"method":"brew"' "$marker"
          out=$(acpilot update --check)
          echo "$out"
          grep -q 'installed by brew' <<<"$out"
          grep -q 'brew upgrade acpilot' <<<"$out"
          set +e
          refusal=$(acpilot update 2>&1)
          status=$?
          set -e
          echo "$refusal"
          test "$status" -ne 0
          grep -q 'brew owns this copy' <<<"$refusal"

  tap:
    name: tap
    needs: [version, installers, homebrew]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # The formula reaches the tap before the release exists, because the two make one
    # promise. A tap advertising a version whose archives nobody shipped is worse
    # than a release that did not happen. `publish` waits for this job, and this job
    # waits for `homebrew`. So the tap only receives a formula that a keg already
    # answers `brew` for.
    steps:
      # `GITHUB_TOKEN` is scoped to this repository and cannot write to the tap, so
      # the push uses a token of its own. This job tests that token here rather than
      # leaving it to `checkout`. A missing credential there fails without naming
      # the secret to add.
      - name: The token the tap is pushed with
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set, so the formula has nowhere to go." >&2
            echo "It is a token with contents: write on skamansam/homebrew-tap;" >&2
            echo "CONTRIBUTING.md says how to make one." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: skamansam/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - uses: actions/download-artifact@v4
        with:
          name: global
          path: dist

      # The formulae are dist's, generated and marked by `cargo xtask dist`. This
      # step only puts them where a tap expects them. A release whose formula is
      # already there is a no-op rather than an empty commit.
      - name: Commit the formulae this release generated
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          cp dist/*.rb tap/Formula/
          cd tap
          if [ -z "$(git status --porcelain)" ]; then
            echo "the tap already carries these formulae"
            exit 0
          fi
          git config user.name "acpilot release"
          git config user.email "noreply@github.com"
          git add Formula
          git commit -m "acpilot ${{ needs.version.outputs.version }}"
          git push

  publish:
    name: publish
    needs: [version, archives, installers, homebrew, tap]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Publishing a release needs `contents: write`, which the workflow already
    # grants. Asking the Docs workflow to run needs `actions: write` as well. The
    # dispatch is an API call on the Actions resource, and the inherited token
    # could not make it. That is why the last step of every release failed with
    # `gh` exit 1, after the release itself had gone out.
    #
    # The recursive-workflow rule exempts `workflow_dispatch`, so the token that
    # dispatches does start the run. The missing permission was the whole failure.
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The signature is what makes the checksum mean something. Both files travel
      # over the same connection, so an attacker who can replace the archive can
      # replace its `.sha256`. Only a signature by a key that never leaves this
      # repository's secrets distinguishes a release from a substitution. This step
      # signs here rather than beside each build, because one key and one step cover
      # every archive. A failure here is a release that does not happen.
      - name: Sign every archive's checksum
        env:
          ACPILOT_SIGNING_KEY: ${{ secrets.ACPILOT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ACPILOT_SIGNING_KEY:-}" ]; then
            echo "ACPILOT_SIGNING_KEY is not set, so this release has no signature." >&2
            echo "Generate the key as docs/release-key.md describes and add the private" >&2
            echo "half as a repository secret; publishing unsigned is not an option." >&2
            exit 1
          fi
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$ACPILOT_SIGNING_KEY" > "$key"
          signed=0
          for checksum in dist/*.sha256; do
            openssl pkeyutl -sign -rawin -inkey "$key" -in "$checksum" -out "$checksum.sig"
            signed=$((signed + 1))
          done
          test "$signed" -gt 0 || { echo "no checksum files were downloaded"; exit 1; }
          echo "signed $signed checksums"

      - name: Release notes
        run: |
          set -euo pipefail
          # The tag comes after these notes. So the range starts from the last tag
          # reachable from the parent commit, not from HEAD^ of the tag.
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$previous" ]; then
            range=""
            heading="First tagged build."
          else
            range="$previous..HEAD"
            heading="Changes since $previous."
          fi
          {
            echo "$heading"
            echo
            git log $range --no-merges --pretty=format:'- %s (%h)' | head -200
          } > notes.md
          cat notes.md

      # One archive per program, named after the package and the target. The tag
      # says which version. Every `.sha256` has a `.sig` beside it, and `acpilot
      # update` reads the signature before it reads the digest.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "Acpilot ${{ needs.version.outputs.version }}" \
            --notes-file notes.md \
            dist/*

      # Nothing goes back into main. The download page reads the releases API at
      # build time, so main stays a tree only pull requests change. Branch
      # protection would block a bot commit here, or it would need an exemption that
      # also lets the bot change code.
      - name: Rebuild the docs site
        if: vars.DOCS_DEPLOY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
