name: release

# A release is a version, and a version is what the merged PR's labels say it is
# (`.github/scripts/next_version.py`):
#
#   breaking / major          → major
#   feature / enhancement     → minor
#   bug / docs / chore / …    → patch
#   skip-release              → nothing
#
# `push` to main, rather than `pull_request: closed`, because a token on a pull
# request from a fork cannot publish: the labels are looked up from the merge
# commit instead (`commits/<sha>/pulls`), which works for merge commits and
# squash merges alike and needs no second trigger. Once main only takes PRs the
# two events describe the same change.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      publish: ${{ steps.next.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the labels of the PR this commit came from
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].labels[].name' 2>/dev/null | paste -sd, - || true)
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          echo "labels: ${labels:-<none>}"

      - name: Next version
        id: next
        env:
          LABELS: ${{ steps.labels.outputs.labels }}
        run: |
          set -euo pipefail
          out=$(python3 .github/scripts/next_version.py --labels "$LABELS")
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"
          version=$(sed -n 's/^version=//p' <<<"$out")
          tag=$(sed -n 's/^tag=//p' <<<"$out")
          if [ -z "$version" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "the labels asked for no release"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already published"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            archive: tar.gz
          - os: macos-14
            target: macos-aarch64
            archive: tar.gz
          - os: windows-latest
            target: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The graphics stack gpui links against. Linux only: the Windows and macOS
      # runners have their system frameworks already. `libxkbcommon-x11-dev` is
      # here because gpui 0.2.2's `xkbcommon` dependency enables the X11 feature
      # unconditionally, so the linker asks for `-lxkbcommon-x11` even though the
      # shell is built Wayland-only-capable; see ADR 0009 §5.
      - name: System libraries gpui links against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev \
            libfreetype-dev libfontconfig1-dev pkg-config clang

      - name: The libc pin gpui 0.2.2 needs
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          versions=$(awk '/^name = "libc"$/ { getline; split($0, parts, "\""); print parts[2] }' Cargo.lock)
          test -n "$versions" || { echo "Cargo.lock lists no libc"; exit 1; }
          for version in $versions; do
            if [ "$version" != "0.2.189" ]; then
              echo "Cargo.lock has libc $version; gpui 0.2.2 -> xattr 0.2.3 uses libc::ENOATTR,"
              echo "which 0.2.190 removed. The pin is exact. Run:"
              echo "  cargo update -p libc --precise 0.2.189"
              exit 1
            fi
          done

      # `acpilot` is the CLI and the TUI; `acpilotd` is the daemon; `acpilot-gui`
      # is the desktop app, built with its feature on because off is the default
      # (a `cargo test --workspace` should not compile a graphics stack). All
      # three ship in one tarball per platform, so the desktop app is a launch
      # away from the daemon it talks to rather than a second download.
      - name: Build
        env:
          # Compiled in by `acpilot_core::VERSION`, so the binaries report the tag
          # they are published as rather than the number in `Cargo.toml`.
          ACPILOT_RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: cargo build --release --locked -p acpilot-cli -p acpilotd -p acpilot-gui --features acpilot-gui/gui

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          stage="acpilot-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp target/release/acpilot target/release/acpilotd target/release/acpilot-gui "$stage/"
          cp README.md LICENSE-APACHE LICENSE-MIT "$stage/"
          tar -czf "$stage.tar.gz" "$stage"
          shasum -a 256 "$stage.tar.gz" > "$stage.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "acpilot-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item target/release/acpilot.exe, target/release/acpilotd.exe, target/release/acpilot-gui.exe $stage
          Copy-Item README.md $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          $hash = (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $stage.zip" | Out-File "$stage.zip.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            acpilot-*.tar.gz
            acpilot-*.tar.gz.sha256
            acpilot-*.zip
            acpilot-*.zip.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Publishing a release needs `contents: write`, which the workflow already
    # grants. Asking the Docs workflow to run needs `actions: write` as well: the
    # dispatch is an API call on the Actions resource, and the inherited token
    # could not make it — which is why the last step of every release failed with
    # `gh` exit 1 after the release itself had already been published.
    #
    # `workflow_dispatch` is the one trigger the recursive-workflow rule exempts,
    # so the token that dispatches does start the run; the missing permission was
    # the whole failure.
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        run: |
          set -euo pipefail
          # The tag is created after these notes, so the range starts from the last
          # tag reachable from the parent commit rather than from HEAD^ of the tag.
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$previous" ]; then
            range=""
            heading="First tagged build."
          else
            range="$previous..HEAD"
            heading="Changes since $previous."
          fi
          {
            echo "$heading"
            echo
            git log $range --no-merges --pretty=format:'- %s (%h)' | head -200
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "Acpilot ${{ needs.version.outputs.version }}" \
            --notes-file notes.md \
            dist/*.tar.gz dist/*.zip dist/*.sha256

      # Nothing is committed back. The download page reads the releases API at
      # build time, so main stays a tree only pull requests change — a bot commit
      # here would be blocked by branch protection or need an exemption that also
      # lets it change code.
      - name: Rebuild the docs site
        if: vars.DOCS_DEPLOY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
