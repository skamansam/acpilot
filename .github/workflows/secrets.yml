name: release credentials

# A credential that ends during a release fails that release in its last step. That
# step pushes the formula or signs the checksums. This job reads what each credential
# says about its own end, and warns a month before it arrives.
#
# The schedule is Monday morning UTC, so the warning is waiting when the week starts.
# `workflow_dispatch` runs the same check after a rotation, which is when a half
# finished one would show.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-credentials
  cancel-in-progress: false

jobs:
  check:
    name: check the tap token and the signing key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `scripts/check-release-secrets.sh` explains both checks. `ACPILOT_KEY_ROTATE_BY`
      # is optional: set it to the date a rotation should happen, and the job warns as
      # that date comes near. An Ed25519 key does not expire on its own.
      - name: Check the two credentials
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          ACPILOT_SIGNING_KEY: ${{ secrets.ACPILOT_SIGNING_KEY }}
          ACPILOT_RELEASE_PUBKEY: ${{ vars.ACPILOT_RELEASE_PUBKEY }}
          ACPILOT_KEY_ROTATE_BY: ${{ vars.ACPILOT_KEY_ROTATE_BY }}
        run: scripts/check-release-secrets.sh
