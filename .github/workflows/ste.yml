name: STE prose

# This workflow runs the AGENTS.md prose rule on a pull request. The local hook
# runs the same script, so a change that passes there passes here. A pull request
# from a clone without the hook gets the same answer from this job.
on:
  pull_request:

concurrency:
  group: ste-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: STE prose lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The script compares the base with HEAD, so the clone needs the merge
          # base and the commits behind it.
          fetch-depth: 0

      # `github.base_ref` is the pull request's target, so this job and a local
      # run use one answer for "what changed".
      - name: Lint the documentation the change touches
        run: scripts/ste-check.sh --docs "origin/${{ github.base_ref }}"
