[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95" # floor set by rusqlite_migration 2.6; see README §5.9
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# internal
# A version is required alongside the path: without it, tooling that reads
# workspace dependencies (cargo-deny, publishing) cannot resolve the requirement
# and reports it as a wildcard.
acpilot-proto = { version = "0.1.0", path = "crates/acpilot-proto" }
acpilot-core = { version = "0.1.0", path = "crates/acpilot-core" }
acpilot-model = { version = "0.1.0", path = "crates/acpilot-model" }
acpilot-agent = { version = "0.1.0", path = "crates/acpilot-agent" }
acpilot-profile = { version = "0.1.0", path = "crates/acpilot-profile" }
acpilot-extensions = { version = "0.1.0", path = "crates/acpilot-extensions" }
# The daemon API as a library: every UI (CLI, TUI, later the GUI and web) calls
# the same surface, so a route cannot be reachable from one frontend and not
# another.
acpilot-client = { version = "0.1.0", path = "crates/acpilot-client" }
acpilot-tui = { version = "0.1.0", path = "crates/acpilot-tui" }
# The seeded world the interface is designed against. Data only, in protocol types,
# so the terminal and the desktop app render one copy of it instead of two that
# drift apart in the first week (P6-3, P10).
acpilot-demo = { version = "0.1.0", path = "crates/acpilot-demo" }
# The page a browser lands on when it is pointed at the daemon. Embedded, so the
# daemon serves its own frontend and a release tarball has no asset directory to
# lose.
acpilot-web = { version = "0.1.0", path = "crates/acpilot-web" }
# The Host seam: where files and processes actually live. Default features are
# off at this entry point so a consumer that only needs the trait — the agent
# engine's filesystem guard — links no crypto stack. A consumer that offers
# remote hosts asks for `features = ["ssh"]` itself; the member's own defaults
# still apply to `cargo test -p acpilot-host`.
acpilot-host = { version = "0.1.0", path = "crates/acpilot-host", default-features = false }

# protocol
agent-client-protocol = { version = "3.4", features = ["process", "stdio"] }
agent-client-protocol-schema = "1.12" # versioned separately from the 3.x runtime

# runtime
tokio = { version = "1.54", features = ["full"] }
futures = "0.3"
# The ACP SDK reads and writes agent pipes on its own threads. `blocking` is the
# adapter between the supervisor's std::process pipes and the SDK's async
# transport, so no pipe is polled from a runtime thread.
blocking = "1"
# Process-group signals for the agent supervisor's tree kill. Safe API on
# purpose: the workspace forbids unsafe code, so `libc::kill` is not available.
rustix = { version = "1", features = ["process"] }

# api
# `ws` is the terminal attach transport: a terminal is bytes in both directions,
# and a WebSocket is the only route in the API that upgrades rather than answers.
axum = { version = "0.8", features = ["ws"] }
# The client half of that upgrade: `handshake` speaks it over a stream the client
# already knows how to open (a unix socket or loopback TCP), `stream` is the
# frames. No TLS feature — the daemon serves none, and an `https://` endpoint is
# refused by name rather than spoken to in the clear.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "stream"] }
axum-extra = "0.12"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "compression-full", "cors"] }
utoipa = { version = "6", features = ["axum_extras"] }

# cli
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
clap_mangen = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "stream"] }
eventsource-stream = "0.2"

# tui
ratatui = "0.30"
crossterm = "0.29"
# What the terminal's own background and foreground are, so `theme_follow_terminal`
# can solve a palette around them. OSC 11/10 with the parts that are easy to get
# wrong hand-rolled: feature detection, raw-mode restore, a timeout, tmux.
terminal-colorsaurus = "1"
# The screen behind a terminal pane, parsed here rather than by a widget: the pane
# also sends keystrokes and resizes back, so it owns the attach, not just the grid.
vt100 = "0.18"

# gui
# gpui is declared here so there is one place to bump it (XT-1), but it is not a
# dependency of acpilot-gui yet: P10 adds it. Keeping it undeclared as a compile
# input keeps `cargo test` fast until the GUI phase starts.
# Pinned exactly on purpose (ADR 0009): a bare "0.2.2" is a caret requirement and
# would float to every later 0.2.x, which is the drift the pin exists to prevent.
gpui = "=0.2.2"
# gui fallback (P0-3 veto): iced = "0.14"

# editor
ropey = "1.6"
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
imara-diff = "0.2"
similar = "3"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
lsp-types = "0.97" # fallback only; see D8
gen-lsp-types = { version = "0.11", features = ["url"] }
async-lsp = "0.2" # probe candidate only; see P7-2
url = "2"

# hosts
# Default features minus `rsa`: russh's default graph pulls `rsa` 0.10.0-rc.18,
# which carries RUSTSEC-2023-0071 (Marvin timing attack) with no fixed release,
# and `cargo deny` fails on it. The cost is explicit: RSA host keys and RSA user
# keys are not accepted yet, so a server offering only `ssh-rsa` is unreachable;
# ed25519 and ECDSA are unaffected. P8-1 re-adds `rsa` with a written
# justification when a host needs it. Feature selection lives here because cargo
# forbids a member overriding `default-features` on an inherited dependency.
russh = { version = "0.64", default-features = false, features = ["flate2", "aws-lc-rs"] }
russh-sftp = "3"
ssh2-config = "0.9"
openssh = "0.11" # optional fallback
portable-pty = "0.9"

# storage & config
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
figment = "0.10"
# `v1` is the platform-independent Entry API (Keychain, Credential Manager,
# Secret Service). Without a feature the crate compiles but offers no store.
keyring = { version = "4.2", features = ["v1"] }
directories = "6"

# misc
# The daemon's TCP token: 256 bits from the system source, because a port has no
# rate limit of its own and the only defence is that guessing is hopeless.
getrandom = "0.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML frontmatter for SKILL.md. serde-saphyr is the maintained, panic-free
# successor to serde_yaml; only the deserializer is linked.
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
schemars = "1"
# The published manifest schema is checked against the presets in a test. Local
# `$ref`s only, so the TLS and HTTP resolver features are off at the call site.
jsonschema = { version = "0.58", default-features = false }
toml = "1.1"
uuid = { version = "1", features = ["v7", "serde"] }
jiff = "0.2"
notify = "8"
arboard = "3.7"
pulldown-cmark = "0.13"
nucleo = "0.5"
thiserror = "2"
anyhow = "1"
miette = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
argon2 = "0.6"

# dev
insta = { version = "1", features = ["json"] }
http-body-util = "0.1"
proptest = "1"
# The registry watches a file, so its tests need a real directory to write into
# and a real rename to replace a file.
tempfile = "3"

[workspace.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
