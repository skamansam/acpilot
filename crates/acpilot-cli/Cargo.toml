[package]
name = "acpilot-cli"
description = "The acpilot command line: a typed client for the daemon API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "acpilot"
path = "src/main.rs"

[dependencies]
acpilot-agent = { workspace = true }
acpilot-client = { workspace = true }
acpilot-core = { workspace = true }
acpilot-extensions = { workspace = true }
acpilot-proto = { workspace = true }
# `acpilot tui` starts in this binary rather than as a second executable: one
# process per surface, and the TUI inherits the same argument surface.
acpilot-tui = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
