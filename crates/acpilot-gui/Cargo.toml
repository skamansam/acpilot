[package]
name = "acpilot-gui"
description = "The native desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# The window, on gpui. Off by default: `cargo test --workspace` should not compile
# a graphics stack (or need `libxkbcommon-x11` to link) before there is anything
# worth drawing. P10-2 builds and runs it with `--features gui`.
gui = ["dep:gpui"]

[[bin]]
name = "acpilot-gui"
path = "src/main.rs"
required-features = ["gui"]

# Building the `gui` feature on Linux needs two things the platform does not
# give you by default, both recorded in ADR 0009 §5 and both a wasted afternoon
# if they are discovered one error at a time:
#
# * the lockfile must hold `libc` at 0.2.189 — gpui 0.2.2 pulls `xattr`, which
#   uses `libc::ENOATTR`, removed in 0.2.190. `cargo update -p libc --precise
#   0.2.189` is the fix, and running plain `cargo update` undoes it.
# * the link needs `libxkbcommon-x11`'s dev symlink even with X11 off, which is
#   its own package on Debian/Ubuntu (`libxkbcommon-x11-dev`). It cannot be
#   pinned away here: gpui 0.2.2 enables `xkbcommon`'s `x11` feature in its own
#   manifest unconditionally, and features are additive, so only a fork of gpui
#   could drop it — and 0.2.2 is the newest published version (ADR 0009 §5).

[dependencies]
acpilot-core = { workspace = true }
acpilot-extensions = { workspace = true }
acpilot-profile = { workspace = true }
# `open_window` hands gpui's error back rather than panicking: a window that
# cannot be created is a launch to report, not a process to abort.
anyhow = { workspace = true }
clap = { workspace = true }
# The single-instance channel: the platform's listener thread sends, the gpui
# executor awaits. Not GPU-related, so it is outside the `gui` feature and the
# instance logic is tested by a plain `cargo test -p acpilot-gui`.
futures = { workspace = true }
gpui = { workspace = true, optional = true }
# A launch that cannot decide which profile to open fails with a message naming
# the file that asked and the profile that was missing.
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
