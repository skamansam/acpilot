[package]
name = "acpilot-profile"
description = "Profiles: config cascade, per-profile roots, secrets namespaces, preferences"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The `[policy]` table is the permission engine's own type, parsed by its own
# loader: a profile that read it into a second shape would be a second opinion
# about what `allow`, `ask` and `deny` mean.
acpilot-agent = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
