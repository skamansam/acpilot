# cargo-deny configuration.
#
# The rule this encodes: a surprise transitive licence is a build failure, not a
# discovery during a release. Additions to the allow-list are a PR with a reason.

[advisories]
yanked = "warn"
# `unmaintained` says the crate's maintenance moved, not that the code is wrong.
# All three below are one fact: zbus 5 kept `zbus_names` and `zvariant` as separate
# crates and zbus 6 folded them back in. They arrive through `keyring` →
# `secret-service` on Linux, where the Secret Service is the only system keyring
# and cargo-deny reports no safe upgrade. Revisit when `secret-service` moves to
# zbus 6, which is the release that makes these advisories moot.
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "zvariant 5 is maintained inside zbus 6; secret-service still pins zbus 5" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 is maintained inside zbus 6; secret-service still pins zbus 5" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 is maintained inside zbus 6; secret-service still pins zbus 5" },
]

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  # `webpki-root-certs` ships Mozilla's root bundle as data, not code, via
  # rustls-platform-verifier (reqwest → TLS). It is permissive and it is the
  # alternative to trusting an unverified store; denying it would mean shipping
  # with no working HTTPS roots.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The allow-list is intentionally broader than today's graph: adding a dependency
# should not fail on a licence we already decided is fine. Unused entries are not
# worth a warning on every run.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Copying a dependency into the tree is how a fork becomes permanent; if you need
# this, say why in the PR.
deny = [
  { crate = "openssl-sys", use-instead = "rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev" # a branch-tracking dependency is not a pinned dependency

# gpui pulls font-kit from a rev-pinned Zed fork (README §5.4). Allowing the org
# rather than one URL is what cargo-deny supports here; combined with
# required-git-spec = "rev" it still cannot mean "track main".
[sources.allow-org]
github = ["zed-industries"]
