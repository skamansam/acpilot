schema_version = 1
id = "acpilot.night-flight"
name = "Night flight"
appearance = "dark"

[ui]
# `bg_panel` sits 1.17:1 from `bg`: far enough to read as a layer, inside the
# 1.10–1.35 window the contrast check holds every theme to. The old value,
# `#0c1424`, measured 1.06:1 — a panel you could only find by looking for it.
bg = "#070d18"
bg_panel = "#141e33"
text = "#e8edf6"
text_muted = "#97a5b8"
accent = "#f7c65c"
accent_high = "#ffe3a8"
border = "#24334a"
success = "#59c98b"
warning = "#f7c65c"
danger = "#ff7a7a"

[syntax]
comment = "#7d8ca3"
keyword = "#f7c65c"
string = "#8ad6a0"
number = "#e0a3ff"
type = "#8fc7ff"
function = "#ffd9a0"
variable = "#e8edf6"
constant = "#ffb3c1"
operator = "#b9c4d4"
punctuation = "#97a5b8"
