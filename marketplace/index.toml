schema_version = 1

# The curated marketplace.
#
# This file is the whole registry: a reviewed list of extension repositories,
# changed only by pull request to this repository. There is no marketplace
# service, no publisher account, and no crawl.
#
# This file proposes a repository. `index.json` is what clients read: a signed
# list of released versions with archive checksums (P4.6-4). An entry moves there
# once the extension is public, licensed, has no install-time script, and its
# release archive installs through `acpilot ext add`. Until then, installing means
# checking the repository out and running `acpilot ext add --from <dir>`.
#
# [[extensions]]
# id = "acpilot.rust-pack"
# repo = "https://github.com/acpilot/extensions"
# path = "rust-pack"                  # directory containing extension.toml
# description = "rust-analyzer preset, a night-flight variant, and Rust snippets."
# publisher = "acpilot"

extensions = []
