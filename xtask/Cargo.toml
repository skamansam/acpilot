[package]
name = "xtask"
description = "Development tasks: cargo xtask <command>"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
acpilot-agent = { workspace = true }
acpilot-extensions = { workspace = true }
# The web client's TypeScript is generated from the document the daemon serves,
# and the paths are inserted in `acpilotd`: assembling the document from
# `acpilot-proto` alone would produce components with no operations in them.
acpilotd = { workspace = true }
serde_json = { workspace = true }
# The capture the site's showcase renders: the TUI's own frames and the desktop
# shell's tables, from the crates that own them rather than from a transcription.
acpilot-showcase = { workspace = true }
clap = { workspace = true }

[lints]
workspace = true
